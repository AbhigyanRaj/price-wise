<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricewise</title>
    <meta name="description" content="AI-assisted dynamic pricing intelligence" />

    <!-- Native form controls and scrollbars follow the theme. -->
    <meta name="color-scheme" content="light dark" />

    <!--
      Blocking, and deliberately so. shadcn's ThemeProvider applies the theme
      class in useEffect, which paints the wrong theme first and then corrects
      it. Running before the bundle means the correct class is on <html> for
      the very first paint. Wrapped in try/catch because localStorage throws in
      a private window with site data blocked.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("pricewise-theme");
          // Dark is the design's default, so this resolves "is it light?" and
          // the stylesheet needs no class at all for the common case.
          var light =
            stored === "light" ||
            ((!stored || stored === "system") &&
              !window.matchMedia("(prefers-color-scheme: dark)").matches);
          // Both classes are set: `light` drives the token overrides, `dark`
          // keeps Tailwind's dark: variants working in the shadcn primitives.
          document.documentElement.classList.toggle("light", light);
          document.documentElement.classList.toggle("dark", !light);
        } catch (e) {
          /* no persisted preference available; the sheet's dark default stands */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
