server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;

  # SPA fallback. React Router owns the URL space, so a hard refresh on
  # /decisions/<uuid> must return index.html rather than 404. try_files checks
  # the filesystem first, so a hashed asset is still served as a real file.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API. The browser sees one origin, so the auth cookies stay
  # first-party and none of the cross-site SameSite=None handling is needed
  # just to run this locally.
  location /api/ {
    # Trailing slash on both sides strips the /api prefix, matching what the
    # Vite dev proxy does and what the backend expects: it mounts /auth and
    # /products at the root, not under /api.
    proxy_pass http://api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The agent pipeline streams over SSE. Buffering turns five visible steps
    # into one long pause and a single burst, which destroys the one thing
    # worth watching.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }
}
