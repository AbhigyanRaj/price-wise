# Local Postgres so a clean clone needs no Supabase account and no shared staging
# database. Supabase *is* Postgres, so Prisma speaks the same protocol to both.
#
# Ports are overridable: 5432 and 8080 are commonly already in use (a Homebrew
# Postgres, another dev server). Defaults match .env.example; override with
# POSTGRES_PORT=5433 docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: pricewise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pricewise
      POSTGRES_PASSWORD: pricewise
      POSTGRES_DB: pricewise
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pricewise-pgdata:/var/lib/postgresql/data
      # Creates pricewise_test alongside pricewise. The image only takes one
      # POSTGRES_DB, and the test suite needs the second one to exist before
      # `test:setup` can migrate into it.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      # The seed script and the CI job both wait on this rather than racing the
      # container, a sleep would be flaky on a slower machine.
      test: ["CMD-SHELL", "pg_isready -U pricewise -d pricewise"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: pricewise-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pricewise-pgdata:
